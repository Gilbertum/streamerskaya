<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14151c">
  <meta name="description" content="Закрытый планировщик коллабораций для стримеров: расписание, свободные окна и приглашения.">
  <title>Collab Room — планировщик стримеров</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="ambient"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Collab Room">
        <span class="brand-mark">✳</span>
        <span><strong>COLLAB ROOM</strong><small>Календарь встреч миров</small></span>
      </a>
      <div class="topright">
        <span class="timezone">◷ Все часы — МСК (UTC+3)</span>
        <span id="identity" class="identity"></span>
        <button id="logout" class="button button-ghost small" type="button" hidden>Выйти</button>
      </div>
    </header>

    <nav id="nav" class="nav" aria-label="Разделы" hidden>
      <button class="nav-item" data-tab="calendar">◫ &nbsp; Расписание</button>
      <button class="nav-item" data-tab="search">✦ &nbsp; Собрать коллаб</button>
      <button class="nav-item" data-tab="inbox">✉ &nbsp; Приглашения <span id="pendingCount" class="pill"></span></button>
      <button class="nav-item" data-tab="profile">♙ &nbsp; Профиль</button>
    </nav>

    <div id="flash" class="flash" role="status" aria-live="polite" hidden></div>
    <main id="screen" class="screen" aria-live="polite">
      <div class="empty">Подключаем комнату…</div>
    </main>
    <footer class="footer"><span>COLLAB ROOM / XWARAN STUDIO</span><span>Приватные планы видны только участникам комнаты. Публичные события — зрителям по ссылке.</span></footer>
  </div>

  <div id="modal" class="modal-layer" hidden>
    <div class="modal-shade" data-action="close-modal"></div>
    <section class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-x" data-action="close-modal" aria-label="Закрыть">×</button>
      <div id="modalContent"></div>
    </section>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
