name: Publish Collab Room to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Collab Room stream editor regression"]
    types: [completed]

permissions:
  contents: read
  pages: write

jobs:
  rebuild:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Request a GitHub Pages branch build at current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
