name: Collab Room stream editor regression
on:
  pull_request:
    paths:
      - 'collabs/app.js'
      - 'collabs/twitch-export.js'
      - 'collabs/manual-collab.js'
      - 'collabs/firestore.rules'
      - 'collabs/views.js'
      - 'collabs/group-wishes.js'
      - 'collabs/moderator-v3.js'
      - 'collabs/streamers-view.js'
      - 'collabs/twitch-panel.js'
      - 'collabs/tests/**'
  push:
    branches: [main]
    paths:
      - 'collabs/app.js'
      - 'collabs/twitch-export.js'
      - 'collabs/manual-collab.js'
      - 'collabs/firestore.rules'
      - 'collabs/tests/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate schedule edit behavior and labels
        run: |
          node --check collabs/app.js
          node --check collabs/manual-collab.js
          node --check collabs/twitch-export.js
          node --check collabs/streamers-view.js
          node --check collabs/moderator-v3.js
          node --test collabs/tests/*.test.mjs
