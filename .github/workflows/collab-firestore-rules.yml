name: Collab Room Firestore rules validation
on:
  pull_request:
    paths:
      - "collabs/firestore.rules"
      - "collabs/firebase.json"
      - ".github/workflows/collab-firestore-rules.yml"
  push:
    branches: [main]
    paths:
      - "collabs/firestore.rules"
      - "collabs/firebase.json"
      - ".github/workflows/collab-firestore-rules.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile Firestore Rules in isolated emulator
        run: npx --yes firebase-tools@15 emulators:exec --project demo-collab-room --config collabs/firebase.json --only firestore --non-interactive "node -e \"console.log('Firestore Rules loaded')\""
